server:
  port: 8083

spring:
  application:
    name: admin-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: serviceconnect-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info

provider-service:
  url: http://localhost:8084

auth-service:
  url: http://localhost:8081