server:
  port: 8083

spring:
  application:
    name: admin-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: serviceconnect-auth

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  user-service:
    url: http://localhost:8082

provider-service:
  url: http://localhost:8084

auth-service:
  url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true


